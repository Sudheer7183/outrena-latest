# OUTRENA Phase 6 — Loki single-binary config
#
# Two deployment profiles are supported via env-var override at startup:
#   - dev/staging:  filesystem storage (no S3 dependency), replication 1
#   - prod:         S3 + boltdb-shipper (or tsdb schema in newer Loki), replication 3
#
# Toggle is driven by the `${LOKI_STORAGE_BACKEND:-filesystem}` interpolation in
# the `common.storage` block below; set `LOKI_STORAGE_BACKEND=s3` in prod env.
#
# Retention: 30d (matches Azure LA workspace retention 30d in monitoring.tf).
# Chunk target size: 1MB (default, kept explicit).
# Auth: enabled (basic auth via htpasswd file in prod, or no-op in dev).
# Compactor: enabled, retention enforced.
#
# Run: `docker run -v $(pwd)/loki-config.yml:/etc/loki/loki-config.yml grafana/loki:2.9.8 -config.file=/etc/loki/loki-config.yml`

auth_enabled: true  # multi-tenant mode disabled for single-org OUTRENA — set true in prod to enable X-Scope-OrgID gating

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info
  http_server_read_timeout: 30s
  http_server_write_timeout: 30s
  # In prod, terminate TLS at the ALB/App Gateway; Loki listens plain HTTP.
  http_tls_config: {}  # populate with cert_file/key_file if terminating TLS at Loki

common:
  path_prefix: /loki  # metadata + WAL location
  replication_factor: ${LOKI_REPLICATION_FACTOR:-1}  # 1 dev/stg, 3 prod
  ring:
    kvstore:
      store: inmemory  # single-binary; swap to 'memberlist' for multi-node prod
  instance_addr: 127.0.0.1
  storage:
    # Common storage block — used by chunks, ruler, and compactor.
    filesystem:  # dev/staging default
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
    # Prod override (when LOKI_STORAGE_BACKEND=s3):
    # s3:
    #   endpoint: ${LOKI_S3_ENDPOINT}
    #   bucketnames: ${LOKI_S3_BUCKET}
    #   region: ${AWS_REGION:-us-east-1}
    #   access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
    #   secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
    #   sse_encryption: true
    #   sse_type: SSE-KMS  # uses bucket-default KMS key

# Block storage — boltdb-shipper is the only choice on Loki 2.x single-binary.
# (Loki 3.x would swap to tsdb; this config stays on 2.x for parity with
# the Grafana dashboards provisioned alongside.)
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: ${LOKI_STORAGE_BACKEND:-filesystem}  # filesystem or s3
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  max_chunk_age: 2h
  chunk_idle_period: 30m
  chunk_target_size: 1048576  # 1MB — explicit per spec
  chunk_retain_period: 30s
  wal:
    enabled: true
    dir: /loki/wal
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: ${LOKI_REPLICATION_FACTOR:-1}
    final_sleep: 0s

limits_config:
  retention_period: 720h  # 30d — matches Azure LA retention 30d
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_streams_per_user: 0  # 0 = unlimited (single-org)
  max_global_streams_per_user: 0
  max_query_length: 721h  # allow querying up to ~30d +1h slop
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # don't ingest logs older than 7d (prevents backfill abuse)
  split_queries_by_interval: 15m
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  cardinality_limit: 100000
  # Tenant label cardinality guard: promtail drops tenant_slug label in prod
  # (see promtail-config.yml relabel), so this should never trigger.

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem  # s3 in prod

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: ${LOKI_ALERTMANAGER_URL:-http://localhost:9093}
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  enable_alertmanager_v2: true

analytics:
  reporting_enabled: false  # disable phone-home to grafana labs

# Single-binary topology — all roles in one process.
target: all  # all-in-one (overrides any per-role enabling)
