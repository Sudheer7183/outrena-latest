name: CD · Staging (AWS)

# Phase 6 — Deploy to AWS staging on push to main (after CI passes via
# workflow_run trigger). Builds + pushes backend/frontend images to ECR with
# staging-latest + $SHA tags, runs terraform plan + posts to PR, applies plan
# with image tags pinned to $SHA, runs smoke tests, notifies Slack.
# OIDC auth (no static AWS keys). Promotes nothing to prod (see cd-prod-aws.yml).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-staging-aws-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.9.8"
  PYTHON_VERSION: "3.11"
  STAGING_BACKEND_TAG: ${{ github.sha }}
  STAGING_FRONTEND_TAG: ${{ github.sha }}

permissions:
  contents: read
  id-token: write
  pull-requests: write
  actions: read

jobs:
  # ── Gate: only proceed if the triggering CI run was successful ───────────────
  check-ci:
    name: Gate · CI success
    runs-on: ubuntu-latest
    outputs:
      ci-ok: ${{ steps.check.outputs.ok }}
      pr-sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Verify CI conclusion
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            core.info(`CI run #${run.id} conclusion=${run.conclusion} event=${run.event}`);
            if (run.conclusion !== 'success') {
              core.setFailed(`CI run ${run.id} did not succeed (conclusion=${run.conclusion}). Staging deploy aborted.`);
            }
            core.setOutput('ok', 'true');
            core.setOutput('sha', run.head_sha);

  # ── Build & push backend + frontend images to ECR (staging tags) ────────────
  build-and-push:
    name: Build & push images → ECR
    runs-on: ubuntu-latest
    needs: check-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.pr-sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push backend
        uses: docker/build-push-action@v7
        with:
          context: outrena-backend
          file: outrena-backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/outrena-backend:staging-latest
            ${{ steps.ecr-login.outputs.registry }}/outrena-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build + push frontend
        uses: docker/build-push-action@v7
        with:
          context: outrena-frontend
          file: outrena-frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/outrena-frontend:staging-latest
            ${{ steps.ecr-login.outputs.registry }}/outrena-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ── Terraform plan against staging tfvars, upload plan to S3, post to PR ────
  terraform-plan:
    name: Terraform · plan (staging)
    runs-on: ubuntu-latest
    needs: check-ci
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.pr-sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: terraform/aws
        run: |
          terraform init \
            -backend-config=envs/staging/backend.tfbackend \
            -input=false

      - name: terraform plan
        working-directory: terraform/aws
        run: |
          terraform plan \
            -var-file=envs/staging/staging.tfvars \
            -var="backend_ecr_tag=${{ github.sha }}" \
            -var="frontend_ecr_tag=${{ github.sha }}" \
            -out=tfplan

      - name: Upload plan to S3
        working-directory: terraform/aws
        run: |
          aws s3 cp tfplan \
            s3://${{ secrets.TF_PLAN_BUCKET }}/plans/aws-staging-${{ github.sha }}.tfplan \
            --region ${{ env.AWS_REGION }}

      - name: Capture plan text
        working-directory: terraform/aws
        id: plan-text
        run: |
          terraform show -no-color tfplan > /tmp/plan.txt
          # Truncate to ~25k chars (GitHub comment limit is 65k, leave headroom)
          head -c 25000 /tmp/plan.txt > /tmp/plan-trunc.txt
          {
            echo "## Terraform Plan · AWS staging"
            echo ""
            echo "Plan key: \`s3://${{ secrets.TF_PLAN_BUCKET }}/plans/aws-staging-${{ github.sha }}.tfplan\`"
            echo ""
            '```hcl'
            cat /tmp/plan-trunc.txt
            echo '```'
          } > /tmp/plan-comment.md

      - name: Find PR for this SHA
        id: find-pr
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const matched = prs.data.find(p => p.head.sha === sha);
            core.setOutput('number', matched ? matched.number : '');
            core.setOutput('found', matched ? 'true' : 'false');

      - name: Post plan to PR
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/plan-comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.find-pr.outputs.number }}'),
              body,
            });

  # ── Apply the plan (staging auto-approves; no manual gate) ──────────────────
  terraform-apply:
    name: Terraform · apply (staging)
    runs-on: ubuntu-latest
    needs: [build-and-push, terraform-plan]
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: terraform/aws
        run: |
          terraform init \
            -backend-config=envs/staging/backend.tfbackend \
            -input=false

      - name: terraform apply
        working-directory: terraform/aws
        run: |
          terraform apply \
            -var-file=envs/staging/staging.tfvars \
            -var="backend_ecr_tag=${{ github.sha }}" \
            -var="frontend_ecr_tag=${{ github.sha }}" \
            -input=false \
            -auto-approve

  # ── Smoke tests against the live staging stack ──────────────────────────────
  smoke-test:
    name: Smoke test · staging endpoints
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install httpx
        run: pip install "httpx==0.28.1"

      - name: Wait for service warmup (60s)
        run: sleep 60

      - name: Smoke test (backend health + keycloak well-known + tenant endpoint)
        env:
          STAGING_API_BASE: https://api.staging.outrena.dev
          STAGING_AUTH_BASE: https://auth.staging.outrena.dev
          TENANT_HOST: https://acme.staging.outrena.dev
        run: |
          python - <<'PY'
          import os, sys, httpx
          targets = [
              ("backend health",    f"{os.environ['STAGING_API_BASE']}/health"),
              ("keycloak well-known", f"{os.environ['STAGING_AUTH_BASE']}/auth/realms/outrena/.well-known/openid-configuration"),
              ("tenant-scoped api", f"{os.environ['TENANT_HOST']}/api/v1/health"),
          ]
          failures = []
          with httpx.Client(timeout=30.0, follow_redirects=True) as c:
              for name, url in targets:
                  try:
                      r = c.get(url)
                      print(f"[{r.status_code}] {name}: {url}")
                      if r.status_code >= 400:
                          failures.append((name, url, r.status_code))
                  except Exception as e:
                      print(f"[ERR] {name}: {url} → {e}")
                      failures.append((name, url, str(e)))
          if failures:
              print("FAIL — non-200 responses:")
              for f in failures:
                  print("  -", f)
              sys.exit(1)
          print("OK — all smoke targets returned 2xx/3xx")
          PY

  # ── Slack notification (always runs after deploy) ───────────────────────────
  notify-slack:
    name: Notify · Slack
    runs-on: ubuntu-latest
    needs: [build-and-push, terraform-plan, terraform-apply, smoke-test]
    if: always()
    steps:
      - name: Post to Slack
        uses: slackapi/slack-github-action@v1.26.0
        with:
          slack-message: |
            *AWS Staging deploy · ${{ github.sha }}*
            Build & push: ${{ needs.build-and-push.result }}
            TF plan:      ${{ needs.terraform-plan.result }}
            TF apply:     ${{ needs.terraform-apply.result }}
            Smoke test:   ${{ needs.smoke-test.result }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
