name: CD · Prod (AWS)

# Phase 6 — Manual promote to AWS prod. Workflow_dispatch with image_tag input
# (default = latest staging SHA). Re-tags staging image as prod-latest + prod-<tag>,
# applies terraform at 5% canary, validates health, then steps through manual
# gates at 25% → 50% → 100% per migration doc §16.3 (exit criteria 5→25→50→100).
# Each gate uses a distinct environment so GitHub branch protection + required
# reviewers enforce the cutover sign-off. Auto-triggers rollback workflow on
# validation failure at the 5% canary stage.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to promote (default: latest staging SHA from secrets.LAST_STAGING_SHA)"
        required: true
        default: "latest-staging"
        type: string
      reason:
        description: "Reason for promote (audit log)"
        required: false
        default: "scheduled cutover"
        type: string

concurrency:
  group: cd-prod-aws-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.9.8"
  PYTHON_VERSION: "3.11"

permissions:
  contents: read
  id-token: write
  actions: write
  issues: write

jobs:
  # ── Manual approval gate (production environment) ───────────────────────────
  approve:
    name: Gate · production approval
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approved
        run: |
          echo "Production promote approved."
          echo "Image tag: ${{ inputs.image_tag }}"
          echo "Reason: ${{ inputs.reason }}"
          echo "Actor: ${{ github.actor }}"

  # ── Re-tag staging image as prod-latest + prod-<tag> in ECR ─────────────────
  promote-images:
    name: Promote · staging → prod tags
    runs-on: ubuntu-latest
    needs: approve
    outputs:
      prod-tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # OWASP A05 gate (Tech Doc §10.7) — verify prod env settings before deploy
      - name: Pre-deploy environment audit
        env:
          ENVIRONMENT: production
          SKIP_JWT_VERIFICATION: ${{ vars.SKIP_JWT_VERIFICATION }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SECRET_BACKEND: ${{ vars.SECRET_BACKEND }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: python3 outrena-backend/scripts/audit_env.py

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve concrete image tag
        id: resolve
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          INPUT_TAG: ${{ inputs.image_tag }}
          FALLBACK_SHA: ${{ secrets.LAST_STAGING_SHA }}
        run: |
          if [ "${INPUT_TAG}" = "latest-staging" ]; then
            if [ -z "${FALLBACK_SHA}" ]; then
              echo "Input was 'latest-staging' but secrets.LAST_STAGING_SHA is empty."
              echo "Pass an explicit image_tag (the staging SHA) instead."
              exit 1
            fi
            TAG="${FALLBACK_SHA}"
          else
            TAG="${INPUT_TAG}"
          fi
          echo "Resolved prod tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Promote backend image (staging → prod tags)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          SRC="${REGISTRY}/outrena-backend:${TAG}"
          docker pull "${SRC}"
          for T in "prod-${TAG}" "prod-latest"; do
            docker tag "${SRC}" "${REGISTRY}/outrena-backend:${T}"
            docker push "${REGISTRY}/outrena-backend:${T}"
          done

      - name: Promote frontend image (staging → prod tags)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          SRC="${REGISTRY}/outrena-frontend:${TAG}"
          docker pull "${SRC}"
          for T in "prod-${TAG}" "prod-latest"; do
            docker tag "${SRC}" "${REGISTRY}/outrena-frontend:${T}"
            docker push "${REGISTRY}/outrena-frontend:${T}"
          done

  # ── Terraform apply at 5% canary weight ─────────────────────────────────────
  terraform-apply-5pct:
    name: Terraform · apply 5% canary
    runs-on: ubuntu-latest
    needs: promote-images
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: terraform/aws
        run: |
          terraform init \
            -backend-config=envs/prod/backend.tfbackend \
            -input=false

      - name: terraform apply (5% weight)
        working-directory: terraform/aws
        env:
          TAG: ${{ needs.promote-images.outputs.prod-tag }}
        run: |
          terraform apply \
            -var-file=envs/prod/prod.tfvars \
            -var="backend_ecr_tag=${TAG}" \
            -var="frontend_ecr_tag=${TAG}" \
            -var="blue_green_weight_new=5" \
            -var="blue_green_weight_old=95" \
            -input=false \
            -auto-approve

  # ── Validate 5% canary (wait 5 min, health checks; trigger rollback on fail) ─
  validate-5pct:
    name: Validate · 5% canary (5 min soak)
    runs-on: ubuntu-latest
    needs: terraform-apply-5pct
    outputs:
      ok: ${{ steps.health.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install httpx
        run: pip install "httpx==0.28.1"

      - name: 5-minute soak wait
        run: |
          echo "Soaking at 5% canary for 5 minutes..."
          sleep 300

      - name: Health check (prod stack via direct ALB Host header)
        id: health
        env:
          PROD_API_BASE: https://api.outrena.com
          PROD_AUTH_BASE: https://auth.outrena.com
          TENANT_HOST: https://acme.outrena.com
        run: |
          set +e
          python - <<'PY'
          import os, sys, httpx
          targets = [
              ("prod backend health", f"{os.environ['PROD_API_BASE']}/health"),
              ("prod keycloak well-known", f"{os.environ['PROD_AUTH_BASE']}/auth/realms/outrena/.well-known/openid-configuration"),
              ("prod tenant api", f"{os.environ['TENANT_HOST']}/api/v1/health"),
          ]
          failures = []
          with httpx.Client(timeout=30.0, follow_redirects=True) as c:
              for name, url in targets:
                  try:
                      r = c.get(url)
                      print(f"[{r.status_code}] {name}: {url}")
                      if r.status_code >= 400:
                          failures.append((name, url, r.status_code))
                  except Exception as e:
                      print(f"[ERR] {name}: {url} → {e}")
                      failures.append((name, url, str(e)))
          if failures:
              print("FAIL — 5% canary unhealthy:")
              for f in failures:
                  print("  -", f)
              sys.exit(1)
          print("OK — 5% canary healthy")
          PY
          RC=$?
          if [ $RC -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          exit $RC

  # ── Trigger rollback on validation failure ──────────────────────────────────
  rollback-on-fail:
    name: Rollback · on 5% canary failure
    runs-on: ubuntu-latest
    needs: validate-5pct
    if: failure()
    steps:
      - name: Invoke rollback workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GHA_PAT_ROLLBACK_DISPATCH }}
          script: |
            const res = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'rollback.yml',
              ref: context.ref,
              inputs: {
                cloud: 'aws',
                environment: 'production',
                to_weight_new: '0',
                reason: `Auto-rollback from cd-prod-aws 5% canary (run ${context.runId})`,
              },
            });
            core.info(`Rollback dispatched: ${res.status}`);

  # ── Manual gate → 25% ────────────────────────────────────────────────────────
  manual-gate-25:
    name: Gate · production-cutover-25 (manual)
    runs-on: ubuntu-latest
    needs: validate-5pct
    environment: production-cutover-25
    steps:
      - name: Approved for 25%
        run: echo "Approved to bump canary from 5% to 25%"

  bump-to-25:
    name: Terraform · apply 25%
    runs-on: ubuntu-latest
    needs: manual-gate-25
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        working-directory: terraform/aws
        run: terraform init -backend-config=envs/prod/backend.tfbackend -input=false
      - name: terraform apply (25% weight)
        working-directory: terraform/aws
        env:
          TAG: ${{ needs.promote-images.outputs.prod-tag }}
        run: |
          terraform apply \
            -var-file=envs/prod/prod.tfvars \
            -var="backend_ecr_tag=${TAG}" \
            -var="frontend_ecr_tag=${TAG}" \
            -var="blue_green_weight_new=25" \
            -var="blue_green_weight_old=75" \
            -input=false -auto-approve

  # ── Manual gate → 50% ────────────────────────────────────────────────────────
  manual-gate-50:
    name: Gate · production-cutover-50 (manual)
    runs-on: ubuntu-latest
    needs: bump-to-25
    environment: production-cutover-50
    steps:
      - name: Approved for 50%
        run: echo "Approved to bump canary from 25% to 50%"

  bump-to-50:
    name: Terraform · apply 50%
    runs-on: ubuntu-latest
    needs: manual-gate-50
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        working-directory: terraform/aws
        run: terraform init -backend-config=envs/prod/backend.tfbackend -input=false
      - name: terraform apply (50% weight)
        working-directory: terraform/aws
        env:
          TAG: ${{ needs.promote-images.outputs.prod-tag }}
        run: |
          terraform apply \
            -var-file=envs/prod/prod.tfvars \
            -var="backend_ecr_tag=${TAG}" \
            -var="frontend_ecr_tag=${TAG}" \
            -var="blue_green_weight_new=50" \
            -var="blue_green_weight_old=50" \
            -input=false -auto-approve

  # ── Manual gate → 100% ───────────────────────────────────────────────────────
  manual-gate-100:
    name: Gate · production-cutover-100 (manual, final)
    runs-on: ubuntu-latest
    needs: bump-to-50
    environment: production-cutover-100
    steps:
      - name: Approved for 100% cutover
        run: echo "Approved to complete cutover to 100%"

  bump-to-100:
    name: Terraform · apply 100% (complete cutover)
    runs-on: ubuntu-latest
    needs: manual-gate-100
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        working-directory: terraform/aws
        run: terraform init -backend-config=envs/prod/backend.tfbackend -input=false
      - name: terraform apply (100% weight — cutover complete)
        working-directory: terraform/aws
        env:
          TAG: ${{ needs.promote-images.outputs.prod-tag }}
        run: |
          terraform apply \
            -var-file=envs/prod/prod.tfvars \
            -var="backend_ecr_tag=${TAG}" \
            -var="frontend_ecr_tag=${TAG}" \
            -var="blue_green_weight_new=100" \
            -var="blue_green_weight_old=0" \
            -input=false -auto-approve

  # ── Slack notification (always) ──────────────────────────────────────────────
  notify-slack:
    name: Notify · Slack
    runs-on: ubuntu-latest
    needs: [promote-images, validate-5pct, bump-to-25, bump-to-50, bump-to-100]
    if: always()
    steps:
      - name: Post to Slack
        uses: slackapi/slack-github-action@v1.26.0
        with:
          slack-message: |
            *AWS Prod promote · tag=${{ inputs.image_tag }} · actor=${{ github.actor }}*
            Promote:    ${{ needs.promote-images.result }}
            5% canary:  ${{ needs.validate-5pct.result }}
            25% bump:   ${{ needs.bump-to-25.result }}
            50% bump:   ${{ needs.bump-to-50.result }}
            100% bump:  ${{ needs.bump-to-100.result }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
