name: CI

# Phase 6 — Continuous Integration pipeline (lint + typecheck + unit + integration
# with Postgres/Redis/Keycloak services + alembic idempotency + tenant isolation
# gate + Terraform validate + env audit + Docker image build + Trivy security scan).
# Triggers on push/PR to main|develop and on workflow_dispatch. Concurrency cancels
# superseded runs on the same ref.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  TERRAFORM_VERSION: "1.9.8"

permissions:
  contents: read

jobs:
  # ── Backend: lint (ruff) ────────────────────────────────────────────────────
  backend-lint:
    name: Backend · ruff lint + format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outrena-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: outrena-backend/pyproject.toml

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

  # ── Backend: typecheck (mypy strict) ─────────────────────────────────────────
  backend-typecheck:
    name: Backend · mypy strict
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outrena-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: outrena-backend/pyproject.toml

      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install \
            "mypy==1.14.0" \
            "pydantic==2.10.4" \
            "pydantic-settings==2.7.1" \
            "fastapi==0.115.6" \
            "sqlalchemy[asyncio]==2.0.36" \
            "asyncpg==0.30.0" \
            "alembic==1.14.0" \
            "redis==5.2.1" \
            "python-jose[cryptography]==3.3.0" \
            "httpx==0.28.1" \
            "structlog==24.4.0" \
            "email-validator==2.2.0" \
            "types-python-jose==3.3.4.20240106" \
            "types-redis==4.6.0.20241004"

      - name: Mypy strict
        run: mypy app

  # ── Backend: unit tests (no service containers) ──────────────────────────────
  backend-test:
    name: Backend · pytest (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outrena-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: outrena-backend/pyproject.toml

      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install \
            "pytest==8.3.4" \
            "pytest-asyncio==0.25.2" \
            "pytest-cov==6.0.0" \
            "fastapi==0.115.6" \
            "uvicorn[standard]==0.34.0" \
            "httpx==0.28.1" \
            "pydantic==2.10.4" \
            "pydantic-settings==2.7.1" \
            "sqlalchemy[asyncio]==2.0.36" \
            "asyncpg==0.30.0" \
            "redis==5.2.1" \
            "python-jose[cryptography]==3.3.0" \
            "structlog==24.4.0" \
            "email-validator==2.2.0" \
            "python-multipart==0.0.20"

      - name: Pytest (collection + unit smoke)
        env:
          ENVIRONMENT: test
          SKIP_JWT_VERIFICATION: "true"
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/15"
          BASE_DOMAIN: localhost
        run: pytest -v --no-cov

  # ── Backend: integration tests with Postgres + Redis + Keycloak ─────────────
  # Per migration doc §7.5 + pitfall #3 (alembic re-run idempotency) + tenant
  # isolation gate (test_isolation.py). Uses the postgres:16-alpine, redis:7-alpine,
  # and keycloak:24.0 service container images.
  backend-integration:
    name: Backend · integration (pg + redis + keycloak)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outrena-backend
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      keycloak:
        image: quay.io/keycloak/keycloak:24.0
        ports:
          - 8080:8080
        env:
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
          KC_HTTP_ENABLED: "true"
          KC_HOSTNAME_STRICT: "false"
          KC_HOSTNAME: localhost
          KC_IMPORT: /opt/keycloak/data/import/realm-export.json
        volumes:
          - ./outrena-backend/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
        options: >-
          --health-cmd "curl -fsS http://localhost:8080/health/ready || exit 1"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 40
    env:
      ENVIRONMENT: test
      SKIP_JWT_VERIFICATION: "true"
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
      REDIS_URL: "redis://localhost:6379/15"
      KEYCLOAK_BASE_URL: "http://localhost:8080"
      KEYCLOAK_REALM: "outrena"
      BASE_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: outrena-backend/pyproject.toml

      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install \
            "pytest==8.3.4" \
            "pytest-asyncio==0.25.2" \
            "pytest-cov==6.0.0" \
            "fastapi==0.115.6" \
            "uvicorn[standard]==0.34.0" \
            "httpx==0.28.1" \
            "pydantic==2.10.4" \
            "pydantic-settings==2.7.1" \
            "sqlalchemy[asyncio]==2.0.36" \
            "asyncpg==0.30.0" \
            "alembic==1.14.0" \
            "redis==5.2.1" \
            "python-jose[cryptography]==3.3.0" \
            "structlog==24.4.0" \
            "email-validator==2.2.0" \
            "python-multipart==0.0.20"

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U test >/dev/null 2>&1; then
              echo "Postgres is up"; exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready"; exit 1

      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
              echo "Redis is up"; exit 0
            fi
            sleep 2
          done
          echo "Redis did not become ready"; exit 1

      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then
              echo "Keycloak is up"; exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not become ready"; exit 1

      - name: Alembic upgrade head (first run)
        run: alembic upgrade head

      - name: Pytest (non-slow, integration tests)
        run: pytest -v --no-cov -m "not slow"

      - name: Alembic upgrade head (second run — idempotency, pitfall #3)
        run: alembic upgrade head

      - name: Tenant isolation test (regression gate)
        run: pytest -v --no-cov tests/integration/test_isolation.py

  # ── Backend: Docker image build ──────────────────────────────────────────────
  backend-image:
    name: Backend · Docker build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck, backend-test, backend-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: outrena-backend
          file: outrena-backend/Dockerfile
          push: false
          tags: outrena-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Frontend: install + typecheck + lint + build ─────────────────────────────
  frontend-build:
    name: Frontend · npm install + typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outrena-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: outrena-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Terraform: fmt + validate (AWS + Azure) ─────────────────────────────────
  terraform-validate:
    name: Terraform · fmt + validate (aws + azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check -recursive (whole tree)
        run: terraform fmt -check -recursive terraform/

      - name: AWS · init -backend=false
        working-directory: terraform/aws
        run: terraform init -backend=false -input=false

      - name: AWS · validate
        working-directory: terraform/aws
        run: terraform validate

      - name: Azure · init -backend=false
        working-directory: terraform/azure
        run: terraform init -backend=false -input=false

      - name: Azure · validate
        working-directory: terraform/azure
        run: terraform validate

  # ── Env audit: duplicate-key check + JWT bypass must be false in stg/prod ────
  audit-env:
    name: Env audit · dup keys + SKIP_JWT_VERIFICATION guard
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run audit_env.py
        run: python scripts/audit_env.py

  # ── Security: Trivy filesystem scan on backend + frontend ───────────────────
  security-scan:
    name: Security · trivy filesystem (HIGH+CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy fs scan — outrena-backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: outrena-backend
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy fs scan — outrena-frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: outrena-frontend
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
