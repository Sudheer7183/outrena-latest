name: PostHog self-driving · post-merge verification

# PH-INFRA — Runs AFTER a PostHog self-driving PR merges to main.
#
# Flow:
#   1. The posthog-self-driving.yml workflow gated the PR through review.
#   2. A human reviews + merges the PR.
#   3. This workflow fires on `push` to main IF the merged commit message
#      contains "[fix]" AND the linked PR had the `posthog-self-driving` label.
#   4. We wait for the production deploy (the regular cd-prod-aws/azure
#      workflow runs in parallel; we poll the deploy status for up to 30 min).
#   5. We wait an additional 10 minutes for traffic to flow against the new
#      version.
#   6. We call the PostHog verification API with the original error report
#      ID (extracted from the PR body):
#        POST /api/projects/{project_id}/error_tracking/<report_id>/verify_fix
#      PostHog then watches the error rate for the next 60 minutes and
#      marks the report "resolved" or "needs re-investigation".
#   7. We post a summary comment back on the original PR with the result.
#
# Authentication:
#   - POSTHOG_PERSONAL_API_KEY — GitHub Actions secret (server-side only).
#   - POSTHOG_PROJECT_ID       — GitHub Actions secret.
#   - POSTHOG_HOST             — GitHub Actions secret (https://posthog.outrena.ai).
#   - AWS/Azure deploy roles   — OIDC, configured in cd-prod-aws.yml etc.
#
# Cross-references:
#   - .github/workflows/posthog-self-driving.yml — the HITL PR gate
#   - .github/workflows/cd-prod-aws.yml         — the prod deploy workflow
#   - docs/posthog-self-driving-setup.md §"Step 7" — production setup
#   - runbooks/15-exception-logging-self-healing.md §"HITL workflow"

on:
  push:
    branches: [main]
  # Manual trigger for re-verification of a previously-merged PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to re-verify (must be merged)"
        required: true
        type: string

concurrency:
  group: posthog-verify-fix-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write # OIDC for AWS/Azure deploy calls (if needed)

jobs:
  # ── Detect whether this push is a PostHog self-driving merge ────────────────
  detect:
    name: Detect · self-driving merge?
    runs-on: ubuntu-latest
    outputs:
      is_self_driving: ${{ steps.check.outputs.is_self_driving }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      report_id: ${{ steps.check.outputs.report_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50 # enough to find the merge commit's PR

      - name: Detect self-driving merge
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // ── Manual dispatch: use the supplied PR number ──────────────────
            if (context.eventName === "workflow_dispatch") {
              const prNumber = parseInt(context.payload.inputs.pr_number, 10);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              const labels = pr.labels.map(l => l.name);
              if (!labels.includes("posthog-self-driving")) {
                core.info(`PR #${prNumber} does not have the 'posthog-self-driving' label — skipping.`);
                core.setOutput("is_self_driving", "false");
                return;
              }
              core.setOutput("is_self_driving", "true");
              core.setOutput("pr_number", String(prNumber));
              const reportId = (pr.body || "").match(/error_tracking\/([a-f0-9-]+)/i)?.[1] || "";
              core.setOutput("report_id", reportId);
              core.info(`Manual re-verify: PR #${prNumber}, report=${reportId || "(none found)"}`);
              return;
            }

            // ── Auto trigger: find the PR that matches the merge commit ───────
            const sha = context.payload.after;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            if (prs.length === 0) {
              core.info("No PR associated with this push — skipping.");
              core.setOutput("is_self_driving", "false");
              return;
            }
            const pr = prs[0];
            const labels = pr.labels.map(l => l.name);
            if (!labels.includes("posthog-self-driving") && pr.user.login !== "posthog-bot") {
              core.info(`PR #${pr.number} is not a PostHog self-driving PR — skipping.`);
              core.setOutput("is_self_driving", "false");
              return;
            }
            core.setOutput("is_self_driving", "true");
            core.setOutput("pr_number", String(pr.number));
            const reportId = (pr.body || "").match(/error_tracking\/([a-f0-9-]+)/i)?.[1] || "";
            core.setOutput("report_id", reportId);
            core.info(`Detected self-driving merge: PR #${pr.number}, report=${reportId || "(none found)"}`);

  # ── Wait for the production deploy (poll workflow status) ───────────────────
  wait-for-deploy:
    name: Wait · production deploy
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.is_self_driving == 'true'
    steps:
      - name: Wait for cd-prod-aws to finish (up to 30 min)
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
        with:
          github-token: ${{ secrets.GHA_PAT_WORKFLOW_READ || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deadline = Date.now() + 30 * 60 * 1000; // 30 min
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            while (Date.now() < deadline) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: "cd-prod-aws.yml",
                event: "workflow_dispatch",
                per_page: 5,
              });
              const recent = runs.workflow_runs.filter(r =>
                r.status === "completed" && r.created_at > new Date(Date.now() - 60 * 60 * 1000).toISOString()
              );
              if (recent.length > 0) {
                const latest = recent[0];
                core.info(`Latest cd-prod-aws run: ${latest.html_url} → ${latest.conclusion}`);
                if (latest.conclusion === "success") {
                  core.info("✅ Prod deploy succeeded.");
                  return;
                }
                if (latest.conclusion === "failure") {
                  core.setFailed("❌ Prod deploy failed — aborting verification.");
                  return;
                }
              }
              core.info("Waiting for prod deploy to complete...");
              await sleep(60_000);
            }
            core.setFailed("⏰ Prod deploy did not complete within 30 min — aborting verification.");

  # ── 10-minute soak so traffic flows against the new version ─────────────────
  soak:
    name: Soak · 10 min traffic
    runs-on: ubuntu-latest
    needs: wait-for-deploy
    steps:
      - name: 10-minute soak wait
        run: |
          echo "Waiting 10 minutes for production traffic to flow against the new version..."
          sleep 600
          echo "Soak complete — calling PostHog verification API."

  # ── Call the PostHog verification API ───────────────────────────────────────
  verify-fix:
    name: Verify · PostHog API
    runs-on: ubuntu-latest
    needs: [soak, detect]
    outputs:
      verification_status: ${{ steps.verify.outputs.status }}
      verification_url: ${{ steps.verify.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install httpx
        run: pip install "httpx==0.28.1"

      - name: Call PostHog verify_fix endpoint
        id: verify
        env:
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          REPORT_ID: ${{ needs.detect.outputs.report_id }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${REPORT_ID}" ]; then
            echo "⚠️ No report ID found in the PR body — cannot call verify_fix."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import os, sys, httpx, json

          host = os.environ["POSTHOG_HOST"].rstrip("/")
          api_key = os.environ["POSTHOG_PERSONAL_API_KEY"]
          project_id = os.environ["POSTHOG_PROJECT_ID"]
          report_id = os.environ["REPORT_ID"]
          pr_number = os.environ["PR_NUMBER"]

          url = f"{host}/api/projects/{project_id}/error_tracking/{report_id}/verify_fix"
          payload = {
              "source_pr": int(pr_number),
              "observation_window_minutes": 60,
              "threshold": "auto",  # PostHog computes pre-fix baseline + 50%
          }
          headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json",
          }
          print(f"POST {url}")
          print(f"  payload: {json.dumps(payload)}")

          with httpx.Client(timeout=60.0) as c:
              r = c.post(url, json=payload, headers=headers)
              print(f"  status: {r.status_code}")
              print(f"  body:   {r.text[:500]}")
              if r.status_code >= 400:
                  print(f"❌ PostHog verify_fix call failed: HTTP {r.status_code}")
                  sys.exit(1)
              data = r.json()
              # PostHog returns { verification_id, status: "monitoring", ... }
              # The actual verdict comes async via webhook after the 60-min window.
              verification_id = data.get("verification_id", "")
              status = data.get("status", "monitoring")
              verification_url = f"{host}/projects/{project_id}/error_tracking/{report_id}/verify_fix/{verification_id}"
              # GitHub Actions output
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"status={status}\n")
                  f.write(f"url={verification_url}\n")
              print(f"✅ PostHog is monitoring for 60 min — verification URL: {verification_url}")
          PY

  # ── Post a summary comment on the original PR ──────────────────────────────
  comment-result:
    name: Comment · verification result
    runs-on: ubuntu-latest
    needs: [verify-fix, detect]
    if: always()
    steps:
      - name: Post verification summary
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
          STATUS: ${{ needs.verify-fix.outputs.verification_status }}
          URL: ${{ needs.verify-fix.outputs.verification_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = process.env.STATUS || "unknown";
            const url = process.env.URL || "";
            const runUrl = process.env.RUN_URL;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);

            const statusEmoji = {
              monitoring: "👀",
              resolved: "✅",
              "needs re-investigation": "❌",
              skipped: "⚠️",
              unknown: "❓",
            }[status] || "❓";

            const body = [
              `## ${statusEmoji} PostHog self-driving verification`,
              ``,
              `| Field | Value |`,
              `|-------|-------|`,
              `| Status | \`${status}\` |`,
              `| Verification URL | ${url || "(skipped — no report ID in PR body)"} |`,
              `| Workflow run | ${runUrl} |`,
              ``,
              `### What happens next`,
              ``,
              `- PostHog will watch the error rate for **60 minutes**.`,
              `- If the error rate drops below the pre-fix baseline + 50%, the`,
              `  report is marked **resolved** and the verification is closed.`,
              `- If the error rate does NOT drop (or rises), the report is marked`,
              `  **needs re-investigation** and PostHog self-driving will re-open`,
              `  a new PR with an updated fix.`,
              ``,
              `### If verification fails`,
              ``,
              `1. Don't revert immediately — investigate first. The fix may be`,
              `   correct but incomplete (e.g. fixes one of several call sites).`,
              `2. Check the error report in PostHog to see if the same error is`,
              `   still firing from a different stack trace.`,
              `3. If the fix is genuinely wrong, revert the merge commit + add the`,
              `   \`posthog-paused\` label so self-driving doesn't immediately`,
              `   re-propose the same fix.`,
              ``,
              `_This comment was posted by \`.github/workflows/posthog-verify-fix.yml\`._`,
            ].join("\n");

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info("Posted verification-summary comment.");
            } catch (e) {
              core.warning(`Could not post comment on PR #${prNumber}: ${e.message}`);
            }
