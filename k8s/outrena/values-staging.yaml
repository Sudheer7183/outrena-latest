# values-staging.yaml — OUTRENA staging cluster overrides.
#
# Usage:
#   helm install outrena ./k8s/outrena \
#     -f k8s/outrena/values.yaml \
#     -f k8s/outrena/values-staging.yaml \
#     -n outrena-staging --create-namespace
#
# Targets a cloud-managed cluster (EKS/GKE/AKS) with external managed Postgres
# + Redis (RDS/CloudSQL/PG-Flexible + ElastiCache/Memorystore/Redis).
# Key differences from prod:
#   - 2 replicas (vs 3+ in prod)
#   - HPA enabled with conservative bounds
#   - PDB enabled (1 minAvailable)
#   - SKIP_JWT_VERIFICATION=false (full JWT verification — must match prod)
#   - LOG_LEVEL=INFO
#   - Single AZ affinity (cost)

global:
  environment: staging
  imageTag: "1.0.0-rc.1"              # bump per release candidate
  imagePullPolicy: IfNotPresent
  baseDomain: staging.outrena.com
  storageProvider: s3
  imagePullSecrets:
    - name: regcred                    # GitHub Container Registry creds

backend:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 65
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    SKIP_JWT_VERIFICATION: "false"     # staging MUST match prod
    VERIFY_JWT_ISSUER: "true"
    LOG_LEVEL: "INFO"
    SCHEDULER_TICK_SECONDS: "300"      # same as prod
    S3_BUCKET: outrena-staging-csv
    S3_REGION: us-east-1

frontend:
  replicas: 2
  autoscaling:
    enabled: false
  pdb:
    enabled: true
    minAvailable: 1

worker:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75

keycloak:
  replicas: 1
  env:
    KC_LOG_LEVEL: INFO

# External managed services — do NOT enable in-cluster subcharts.
postgres:
  enabled: false
  existingSecret: outrena-postgres-secret

redis:
  enabled: false
  existingSecret: outrena-redis-secret

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: app.staging.outrena.com
      paths:
        - path: /api(/|$)(.*)
          pathType: Prefix
          serviceName: backend
          servicePort: 8000
        - path: /auth(/|$)(.*)
          pathType: Prefix
          serviceName: keycloak
          servicePort: 8080
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
  tls:
    - secretName: outrena-staging-tls
      hosts:
        - app.staging.outrena.com

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  postgresNamespace: database
  redisNamespace: database

# Optional: SecretProviderClass for AWS Secrets Manager sync.
secretProvider:
  enabled: false                       # flip to true to enable CSI sync

# Soft node anti-affinity — prefer different AZs but tolerate single-AZ.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/part-of
                operator: In
                values:
                  - outrena
          topologyKey: topology.kubernetes.io/zone
