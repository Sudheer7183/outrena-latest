{{/*
worker-hpa.yaml — HPA for Celery workers.
CPU-driven; Celery queue depth is a better signal but requires a custom
metrics exporter (not implemented in v1). See ecs_worker.tf comment.
*/}}
{{- if .Values.worker.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "outrena.fullname" . }}-{{ include "outrena.worker.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outrena.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "outrena.worker.name" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "outrena.fullname" . }}-{{ include "outrena.worker.name" . }}
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    # Workers scale up FAST under burst (autopilot queue fills).
    # Scale down slow to avoid thrashing on the per-task CPU spike.
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600    # 10min — let long tasks finish
      policies:
        - type: Percent
          value: 25
          periodSeconds: 180
      selectPolicy: Min
{{- end }}
