{{/*
secret-provider.yaml — SecretProviderClass for the Secrets Store CSI driver.

When enabled, this mounts secrets from AWS Secrets Manager (or Azure Key Vault)
as files at /mnt/secrets-store/<key>. The `secretObjects` block syncs those
files to a Kubernetes Secret consumed by envFrom (no app code change).

PREREQUISITES:
  - Secrets Store CSI driver installed:
      helm install csi-secrets-store \
        secrets-store-csi-driver/secrets-store-csi-driver \
        -n kube-system
  - Provider installed:
      AWS:  kubectl apply -f https://raw.githubusercontent.com/aws/secrets-store-csi-driver-provider-aws/main/deployment/aws-provider-installer.yaml
      Azure: kubectl apply -f https://raw.githubusercontent.com/Azure/secrets-store-csi-driver-provider-azure/master/deployment/provider-azure.yaml
  - IRSA (AWS) or AAD Pod Identity (Azure) configured so the driver's
    service account can read the secrets.

This is a PLACEHOLDER — operators must fill in real objectName / secretARNs
matching their Secrets Manager layout. The chart does NOT validate them.

Disabled by default (secretProvider.enabled: false) — operators who prefer
plain Kubernetes Secrets (via external-secrets / sealed-secrets) leave this
off and provision .Values.backend.existingSecret manually.
*/}}
{{- if .Values.secretProvider.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "outrena.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outrena.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secretProvider.provider }}
  {{- if eq .Values.secretProvider.provider "aws" }}
  parameters:
    region: {{ .Values.secretProvider.aws.region | quote }}
    objects: |
      {{ .Values.secretProvider.aws.objects | nindent 6 }}
  {{- else if eq .Values.secretProvider.provider "azure" }}
  parameters:
    usePodIdentity: {{ .Values.secretProvider.azure.usePodIdentity | quote }}
    useVMManagedIdentity: {{ .Values.secretProvider.azure.useVMManagedIdentity | quote }}
    keyvaultName: {{ .Values.secretProvider.azure.keyVaultName | quote }}
    tenantId: {{ .Values.secretProvider.azure.tenantId | quote }}
    objects: |
      {{ .Values.secretProvider.azure.objects | nindent 6 }}
  {{- end }}
  # Sync mounted files into a Kubernetes Secret so envFrom works unchanged.
  secretObjects:
    - secretName: {{ .Values.backend.existingSecret }}
      type: Opaque
      labels:
        {{- include "outrena.labels" . | nindent 8 }}
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: REDIS_AUTH_TOKEN
          key: REDIS_AUTH_TOKEN
        - objectName: KEYCLOAK_ADMIN_PASSWORD
          key: KEYCLOAK_ADMIN_PASSWORD
        - objectName: MAILBRIDGE_DEFAULT_URL
          key: MAILBRIDGE_DEFAULT_URL
{{- end }}

{{/*
NOTE: When this SecretProviderClass is enabled, the backend/worker Deployments
must mount the CSI volume. Add this to backend-deployment.yaml's pod spec:

  volumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: {{ include "outrena.fullname" . }}-secrets

The volumeMount is OPTIONAL — envFrom reads from the synced Kubernetes Secret,
not the CSI mount. The CSI mount is required only if the driver is configured
with `secretObjects` (which it is above), in which case the volume presence
triggers the sync. Mount it on /mnt/secrets-store (readOnly).
*/}}
