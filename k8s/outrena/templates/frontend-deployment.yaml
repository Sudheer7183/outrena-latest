{{/*
frontend-deployment.yaml — nginx serving the Vite build.
- 2 replicas default
- No envFrom (frontend has no secrets; env vars are baked at build time
  or injected at runtime via the nginx entrypoint for window.__ENV__).
- readOnlyRootFilesystem — nginx writes to /tmp via emptyDir scratch.
- No liveness/readiness probes — nginx responds to / within milliseconds.
  The ingress controller's backend-healthcheck is sufficient.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "outrena.fullname" . }}-{{ include "outrena.frontend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outrena.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "outrena.frontend.name" . }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "outrena.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ include "outrena.frontend.name" . }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "outrena.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ include "outrena.frontend.name" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "outrena.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: default
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "outrena.frontend.name" . }}
          image: {{ include "outrena.image" (list . .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: VITE_API_BASE_URL
              value: "/api/v1"           # same-origin via ingress path rule
            - name: VITE_KEYCLOAK_URL
              value: {{ printf "https://auth.%s" .Values.global.baseDomain | quote }}
            - name: VITE_KEYCLOAK_REALM
              value: "outrena"
            - name: VITE_KEYCLOAK_CLIENT_ID
              value: "outrena-frontend"
            - name: BASE_DOMAIN
              value: {{ .Values.global.baseDomain | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.global.environment | quote }}
            {{- range $k, $v := .Values.frontend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # nginx starts in <1s — skip readiness, use a TCP socket probe instead.
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          # nginx needs writable /tmp + /var/cache/nginx even with
          # readOnlyRootFilesystem — mount an emptyDir.
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
