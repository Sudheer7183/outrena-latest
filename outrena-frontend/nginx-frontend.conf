server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unknown route returns index.html so react-router
    # can pick it up client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must NEVER be cached — it contains hashed asset filenames
    # that change on every build. A stale cached index.html references old
    # JS/CSS chunk hashes that no longer exist → 404 on assets → hard reload.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # silent-check-sso.html must also not be cached — Keycloak needs the
    # live version for SSO session verification.
    location = /silent-check-sso.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # API proxy (production nginx terminates TLS and routes /api → backend;
    # this dev-container-friendly config proxies to the backend service).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /platform/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static asset caching — Vite outputs content-hashed filenames so these
    # can be cached indefinitely. The hash changes on every build so users
    # always get fresh assets after a deploy.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|gif|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
}
