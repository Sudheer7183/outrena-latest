"""
pytest.ini — pytest configuration for the OUTRENA E2E suite (spec §15.2).

This file is intentionally scoped to tests/e2e/ so it does not collide with
the root pyproject.toml (owned by FIX-ALL-1) or the integration suite's
pytest config. Running `pytest tests/e2e/ -m e2e` from the backend root will
pick up this file because pytest merges the closest ini to each test dir.

Key choices:
  * `asyncio_mode = auto` — let pytest-asyncio auto-detect async tests
    (some Playwright helpers may be async if a future migration switches to
    playwright.async_api; the marker keeps both modes usable).
  * `markers` — register the `e2e` marker so `pytest -m e2e` selects only
    this suite when run from the repo root alongside unit + integration tests.
  * `addopts` — sensible defaults: show short test summary, fail fast on the
    first error (E2E runs are slow; one broken step cascades), capture
    videos on failure.
"""
[pytest]
# ── Async (future-proofing for playwright.async_api) ─────────────────────────
asyncio_mode = auto

# ── Test discovery ───────────────────────────────────────────────────────────
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Markers (registered so -W error::pytest::PytestUnknownMarkExpression is a no-op) ──
markers =
    e2e: end-to-end Playwright tests (spec §15.2) — requires running frontend + backend + Keycloak
    e2e_login: login/logout flow tests
    e2e_autopilot: autopilot pipeline golden-path tests
    e2e_sequence: sequence review flow tests
    e2e_reply: reply triage flow tests
    slow: tests that take > 30s (excluded from `-m "e2e and not slow"`)

# ── Defaults ─────────────────────────────────────────────────────────────────
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --color=yes

# ── Minimum versions (fail fast if the CI image is stale) ────────────────────
minversion = 8.3

# ── Logging ──────────────────────────────────────────────────────────────────
log_cli = false
log_cli_level = INFO
log_level = INFO
