# ============================================================================
# OUTRENA — backend edge gateway (Tech Doc §10.8 / URD FR-121, NFR editions)
# TLS termination + per-tenant Host preservation + rate-limit zones.
# ============================================================================
worker_processes auto;

events { worker_connections 4096; }

http {
    include       mime.types;
    default_type  application/json;
    sendfile      on;
    server_tokens off;

    # ── Rate-limit zones (FR-121) ───────────────────────────────────────────
    # api  : 30 req/s per IP, burst 60 (nodelay) — /api/v1/* + /platform/*
    # auth : 5 req/s per IP, burst 10 — Keycloak auth paths + public GDPR/DSR
    limit_req_zone $binary_remote_addr zone=api:20m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_status 429;

    upstream outrena_backend { server backend:8000; keepalive 64; }
    upstream keycloak        { server keycloak:8080; keepalive 16; }

    server {
        listen 443 ssl;
        http2  on;
        server_name ~^(?<tenant>[a-z0-9-]+)\.outrena\.com$ outrena.com;

        ssl_certificate      /etc/nginx/certs/wildcard.outrena.com.crt;
        ssl_certificate_key  /etc/nginx/certs/wildcard.outrena.com.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Retry-After 1 always;

        # ── Auth + public GDPR endpoints: tight zone ────────────────────────
        location ~ ^/(realms|auth)/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://keycloak;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ~ ^/api/v1/(gdpr/dsr|public/unsubscribe) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://outrena_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── API: standard zone ──────────────────────────────────────────────
        location ~ ^/(api|platform)/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://outrena_backend;
            proxy_set_header Host $host;                # per-tenant subdomain preserved
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 65s;
        }

        location = /health  { proxy_pass http://outrena_backend; access_log off; }
        location = /metrics { allow 10.0.0.0/8; deny all; proxy_pass http://outrena_backend; }

        # SPA (static) — served by the frontend container in compose/prod;
        # this fallback covers single-box deployments.
        location / {
            proxy_pass http://outrena_backend;
            proxy_set_header Host $host;
        }
    }
    

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
