# alembic.ini — Alembic configuration (Phase 1: basic setup).
#
# Phase 1: just enough config for `alembic current` to return 'base'.
# Phase 2 replaces env.py with the dual-mode multi-schema runner
# (ALEMBIC_TARGET_SCHEMA env var + iterate-all-active-tenants mode).
#
# The DATABASE_URL is read from app.core.config.Settings (NOT from this file)
# so the same source-of-truth feeds the app, alembic, and docker-compose.

[alembic]
script_location = alembic

# Template for new migration scripts
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for filename timestamps (UTC for reproducible builds)
timezone = UTC

# Truncate long revision messages
truncate_slug_length = 40

# Output line length
output_encoding = utf-8

# Phase 1 placeholder — env.py overrides this with the app's DATABASE_URL.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Compare types strictly (catch column-type drift in autogenerate)
[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
